apiVersion: apps/v1
kind: Deployment
metadata:
  name: paaruwa-resort-agent
spec:
  selector:
    matchLabels:
      app: paaruwa-resort-agent
  template:
    metadata:
      labels:
        app: paaruwa-resort-agent
    spec:
      containers:
      - name: agent
        # IMPORTANT: Replace YOUR_PROJECT_ID here!
        image: asia-southeast1-docker.pkg.dev/ict-gaistudio-prod-01/ai-voice-agent-repo/paaruwa-resort-agent:v2
        envFrom:
        - secretRef:
            name: paaruwa-resort-agent-secrets
        resources:
          requests:
            cpu: "4"     
            memory: "8Gi" 
            ephemeral-storage: "4Gi" 
      # Give active calls up to 15 minutes to finish before shutting down
      terminationGracePeriodSeconds: 900 
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paaruwa-resort-agent-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paaruwa-resort-agent
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # Spin up a new pod early before the first one fills up!