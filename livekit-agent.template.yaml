apiVersion: apps/v1
kind: Deployment
metadata:
  name: paaruwa-agent-deployment
  namespace: default
  labels:
    app: paaruwa-agent
spec:
  replicas: ${MIN_REPLICAS}
  selector:
    matchLabels:
      app: paaruwa-agent
  template:
    metadata:
      labels:
        app: paaruwa-agent
    spec:
      containers:
        - name: paaruwa-agent
          image: ${IMAGE_TAG}
          resources:
            requests:
              cpu: ${CPU_REQUEST}
              memory: ${MEMORY_REQUEST}
            limits:
              cpu: ${CPU_LIMIT}
              memory: ${MEMORY_LIMIT}
          envFrom:
            - secretRef:
                name: livekit-agent-secrets
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paaruwa-agent-deployment-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paaruwa-agent-deployment
  minReplicas: ${MIN_REPLICAS}
  maxReplicas: ${MAX_REPLICAS}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: ${TARGET_CPU_PERCENT}
