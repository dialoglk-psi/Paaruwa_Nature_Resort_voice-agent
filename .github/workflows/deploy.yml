name: Deploy Paaruwa Agent

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    branches:
      - main

env:
  REGISTRY: psi-nprod-registry.tencentcloudcr.com
  NAMESPACE: paaruwa-agent
  REPOSITORY: Paaruwa_Nature_Resort_voice-agent
  DEPLOYMENT_NAME: paaruwa-agent-deployment
  CPU_REQUEST: "1000m"
  CPU_LIMIT: "2000m"
  MEMORY_REQUEST: "1024Mi"
  MEMORY_LIMIT: "2048Mi"
  MIN_REPLICAS: "2"
  MAX_REPLICAS: "20"
  TARGET_CPU_PERCENT: "70"
  REGION: ap-singapore
  CLUSTER_ID: cls-my0y68vu

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > "$HOME/.kube/config"

      - name: Inject variables into manifest
        run: |
          export IMAGE_TAG="${{ env.IMAGE_TAG }}"
          export CPU_REQUEST="${{ env.CPU_REQUEST }}"
          export CPU_LIMIT="${{ env.CPU_LIMIT }}"
          export MEMORY_REQUEST="${{ env.MEMORY_REQUEST }}"
          export MEMORY_LIMIT="${{ env.MEMORY_LIMIT }}"
          export MIN_REPLICAS="${{ env.MIN_REPLICAS }}"
          export MAX_REPLICAS="${{ env.MAX_REPLICAS }}"
          export TARGET_CPU_PERCENT="${{ env.TARGET_CPU_PERCENT }}"
          envsubst < livekit-agent.template.yaml > livekit-agent.manifest.yaml

      - name: Apply manifest
        run: kubectl apply -f livekit-agent.manifest.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n default --timeout=300s
